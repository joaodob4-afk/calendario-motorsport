name: Diagnostico F2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Rodar diagnóstico
        run: python .github/scripts/diagnostico_f2.py

      - name: Guardar HTML baixado
        uses: actions/upload-artifact@v7
        with:
          name: paginas-f2
          path: pagina_*.html
