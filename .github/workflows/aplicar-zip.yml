name: Aplicar zip de mudanças

# Roda sozinho quando o arquivo testes.zip é enviado para um branch (menos o main).
# Extrai o zip por cima do projeto, apaga o zip e faz commit no mesmo branch.
on:
  push:
    branches-ignore:
      - main
    paths:
      - 'testes.zip'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o zip por cima do projeto
        run: |
          test -f testes.zip || { echo "ERRO: testes.zip não está na raiz do repositório."; exit 1; }
          unzip -o testes.zip
          rm testes.zip

      - name: Enviar para o mesmo branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar mudanças de testes.zip"
          git push