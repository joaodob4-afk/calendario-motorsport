name: Diagnostico F1 Academy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rodar diagnóstico F1 Academy
        run: python .github/scripts/diagnostico_f1academy.py
      - name: Guardar HTML baixado
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paginas-f1academy
          path: f1academy_*.html
          if-no-files-found: ignore