name: Gerar APK

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - integracao-cache-indycar
      - fix/f1-calendar-offline-cache
      - audit/validacao-calendarios-f2-f3

  workflow_dispatch:

  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Consultar calendário oficial da F2
        continue-on-error: true
        run: python .github/scripts/atualizar_f2.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Executar testes automatizados
        run: gradle testDebugUnitTest

      - name: Preparar chave de assinatura
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/calendario-motorsport.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/calendario-motorsport.jks" >> "$GITHUB_ENV"

      - name: Gerar APK assinado
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: calendario-motorsport-apk
          path: app/build/outputs/apk/debug/app-debug.apk