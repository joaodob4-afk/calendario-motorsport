name: Manter workflows ativos

# O GitHub desativa workflows agendados depois de 60 dias sem atividade
# no repositório. Este workflow registra um commit simples 2 vezes por mês
# para manter os outros workflows ativos.

on:
  schedule:
    - cron: '0 12 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atividade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Registrar atividade
        run: |
          date -u +"%Y-%m-%d" > .github/ultima-atividade.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ultima-atividade.txt
          if git diff --cached --quiet; then
            echo "Nada para salvar."
          else
            git commit -m "Manter workflows ativos"
            git pull --rebase
            git push
          fi