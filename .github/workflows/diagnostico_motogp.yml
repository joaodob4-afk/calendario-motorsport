name: Diagnostico MotoGP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Rodar diagnóstico MotoGP
        run: python .github/scripts/diagnostico_motogp.py 2026

      - name: Guardar JSON baixado
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: motogp-eventos
          path: motogp_events_*.json
          if-no-files-found: ignore