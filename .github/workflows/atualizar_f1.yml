name: Atualizar calendario F1

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Atualizar f1_calendar.json
        run: python .github/scripts/atualizar_f1.py

      - name: Salvar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/f1_calendar.json
          if git diff --cached --quiet; then
            echo "Nada para salvar."
          else
            git commit -m "Atualizar calendário F1"
            bash .github/scripts/publicar_calendarios.sh
          fi