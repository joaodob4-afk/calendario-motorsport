name: Atualizar calendario MotoGP, Moto2 e Moto3

on:
  schedule:
    - cron: '45 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Atualizar calendários
        run: python .github/scripts/atualizar_moto.py

      - name: Salvar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/motogp_calendar.json app/src/main/assets/moto2_calendar.json app/src/main/assets/moto3_calendar.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos calendários."
          else
            git commit -m "Atualizar calendário MotoGP, Moto2 e Moto3"
            bash .github/scripts/publicar_calendarios.sh
          fi
