name: Atualizar calendario F2

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Atualizar f2_calendar.json
        run: python .github/scripts/atualizar_f2.py

      - name: Salvar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/f2_calendar.json
          if git diff --cached --quiet; then
            echo "Nada para salvar."
          else
            git commit -m "Atualizar calendário F2"
            git push
          fi